<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>📋 Gestor de tareas</h1>
      <p class="app__sub">Proyecto de prueba &middot; flujo de trabajo</p>
    </header>

    <form id="form-tarea" class="form" autocomplete="off">
      <input id="input-titulo" type="text" placeholder="Nueva tarea..." maxlength="120">
      <button type="submit">Agregar</button>
    </form>

    <div class="buscador">
      <input id="buscador" type="search" placeholder="Buscar tareas...">
    </div>

    <p id="mensaje" class="mensaje" hidden></p>

    <ul id="lista" class="lista"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
